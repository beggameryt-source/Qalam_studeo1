<!--
==================================================================
QALAM STUDIO: AI UCHUN ESLATMA
Bu izohni O'CHIRMA. Har yangilanishda shu izohni ham yangila.
Short note in English: this is a single-file HTML app (video subtitles, translation, dubbing, cutting). Read this note first, follow the rules below, keep this note at the top of the file, and increase the update number by one on every change.
==================================================================

0. FOYDALANUVCHI HAQIDA
Foydalanuvchi faylni o'zi sinab, tayyor holda yuboradi: faqat so'ralgan qismni va fayl ochilishini tekshiring, uzun sinovlar o'tkazmang. Lekin tasodifan jiddiy xato ko'rsangiz, baribir bir jumla bilan ayting.
Egasi dasturchi emas. Sodda o'zbek tilida yozing, qisqa va tushunarli. Ish tugagach nima o'zgargani va telefonda nimani sinab ko'rish kerakligini ayting.

1. YANGILANISH RAQAMI
Joriy yangilanish raqami: 70
Har yangilanishda raqam bittaga oshadi (69, 70, 71...). Boshqa AI bilan ishlansa ham hisob shundan davom etadi.
Har safar 3 joyni yangilang: (a) shu izohdagi raqam, (b) skriptdagi const APP_VER, (c) fayl nomi Qalam_Studio_N.html.
Ekran pastida «Qalam Studio · N-yangilanish» yozuvi APP_VER dan o'zi chiqadi.

2. ILOVA NIMA
Telefon uchun bitta HTML fayl (HTML, CSS va JS bir joyda). Videoga subtitr qiladi: nutqni matnga o'giradi (Whisper), tarjima qiladi, dublyaj (foydalanuvchi ovozini yozish yoki tayyor ovoz fayl qo'shish), musiqa, rasm, videoni kesish va tayyor videoni eksport qilish.
Loyihalar brauzerda saqlanadi (localStorage va IndexedDB). AI kalitlarini foydalanuvchi Sozlamalarda o'zi kiritadi (Groq, OpenAI, OpenRouter, Google). Kalitlarni faylga yozmang.

3. QOIDALAR
- Katta «Video tarjima qilish» oynasi va «Shorts tarjima qilish» oynasi ALOHIDA yangilanadi. Birini o'zgartirganda ikkinchisiga tegmang. Hozir ikkalasi umumiy funksiyalar ustida ishlaydi: pickVideo(kind), transSheet(ok), startBatch(ok,opt); birini mustaqil o'zgartirish kerak bo'lsa, avval ularni ikkita alohida funksiyaga ajrating.
- Tartib: Video yoki Shorts tugmasi bosilganda AVVAL video tanlash oynasi ochiladi. «Video» tugmasi (bigBtn): video tanlangach tarjima SO'RALMAYDI, video darhol tahrirlash ekranida ochiladi; tarjima faqat «AI Tarjima» menyusidan boshlanadi (foydalanuvchi talabi, 10-yangilanish). «Shorts» tugmasi (shortBtn): video tanlangach til va uslub so'raladi va tarjima avtomatik ketadi. Buni teskari qilmang.
- So'ralmasa tahrirlash ekraniga, subtitr, dublyaj, kesish va eksport mantiqiga tegmang.
- Kirish oynasidagi 3 tugma: Video (elektr ko'k, chapda katta), Shorts (qizil, o'ng tepada), Musiqa (binafsha, o'ng pastda, «Tez orada»). Tugmalardan ortiqcha izoh matnlari olib tashlangan, ularni qaytarmang. O'ng tugmalar Video tugmasi balandligidan oshmasin.
- Bu ID'larni o'chirmang va nomini o'zgartirmang, JS ularga bog'langan: bigBtn, shortBtn, musBtn, fi, fsh, bD, bK, exB, back.
- Subtitr obyektidagi spk (kim gapiryapti) va dublyaj bo'lagidagi voice maydonlarini o'chirmang: ular loyiha bilan saqlanadi.
- Saqlash kalitlarini o'zgartirmang (localStorage: sds_w, sds_gl; IndexedDB: sds). Aks holda foydalanuvchining eski loyihalari yo'qoladi.
- Chegaralar: «Video» tugmasi kodda 2000 MB deb belgilangan, lekin tahrirlash uchun ochishda hajm tekshirilmaydi. AI Tarjima: MP4 (AAC ovoz) tezkor usulda 3 soatgacha; boshqa formatlarda 500 MB gacha; Shorts uchun har biri 3 daqiqa va 120 MB gacha.
- Dublyaj avtomatik emas: ilovada tayyor ovoz yaratish yo'q. Buni bor deb va'da qilmang.
- Fayl yozilgach skript sintaksisini tekshiring va telefonda ochilishini ta'minlang.

4. O'ZGARISHLAR TARIXI
1: Yangi kirish oynasi, pastki menyu, Qo'llanma, tushunarli tugma nomlari.
2: Qisqa videolar: avtomatik tarjima; ortiqcha bloklar olib tashlandi; menyu ixchamlandi.
3: Kirish oynasida 3 ta katta tugma (Video, Short video, Musiqa: tez orada); yangilanish raqami.
4: Tugmalar rasmdagidek joylashtirildi: chapda katta Video, o'ngda tepada Shorts, pastda Musiqa.
5: Video tugmasi elektr ko'k, Shorts to'liq qizil, Musiqa to'liq binafsha va biroz kichikroq; bosishga qulay.
6: Video va Shorts tugmalaridan ortiqcha izohlar olib tashlandi; Shorts va Musiqa nomi ikonka yonida kichik; o'ng tugmalar Video tugmasidan oshmaydi.
7: AI uchun to'liq eslatma izohi qo'shildi (ilovaning o'zi o'zgarmadi).
8: Video va Shorts tugmasi bosilganda avval video tanlanadi, keyin til va uslub so'raladi.
9: Eslatmaga rejalar qo'shildi (Netlify, Color Mania, eslatish qoidasi); ilovaning o'zi o'zgarmadi.
10: «Video» tugmasi: video tanlangach avtomatik tarjima so'ralmaydi, video to'g'ridan-to'g'ri tahrirlash ekranida ochiladi. Tarjima faqat «AI Tarjima» menyusidan boshlanadi. Shorts o'zgarmadi.
11: Katta video xotirasi, 1-bosqich: AI tarjimada audio 16 kHz da ochiladi (xotira ~3 baravar kam), qo'shimcha nusxa olinmaydi, chegara 300 dan 500 MB ga, uzun video ogohlantirishi 60 daqiqadan. Telefonda sinash kerak.
12: Kichik tozalash: ishlatilmaydigan saveDub olib tashlandi; Qo'llanmadagi SRT gapi to'g'rilandi; «Saqlash» bosilganda «Saqlandi ✓» yozuvi chiqadi.
13: Eslatmaga barcha keyinga qoldirilgan ishlar yozildi; ilovaning o'zi o'zgarmadi.
19: AI tarjima: (a) tarjimada 400/404/422 xato chiqsa darhol to'xtaydi (ilgari ~150 ta behuda so'rov ketardi); (b) jim bo'laklar Whisperga yuborilmaydi (limit tejaladi); (c) ovozni kuchaytirish 8 baravardan 3 baravarga tushirildi. Telefonda sinash kerak.
20: AI tarjima saqlab davom ettiriladi: har Whisper bo'lagi va har tarjima qismi telefon xotirasiga (IndexedDB, kalit 'tr'+loyiha id) yoziladi. Limit tugasa yoki internet uzilsa, «Boshlash»ni qayta bosganda «Davom ettirilsinmi?» deb so'raydi. Tarjima tugagach yoki loyiha o'chirilganda saqlangan qism o'chadi. Telefonda sinash kerak.
21: Eksport: (a) WEBM faylga davomiylik yoziladi (galereya/pleyerda uzunlik va surish ishlaydi); (b) eksport ovoziga limiter qo'shildi (chirsillash kamayadi); (c) «Audioni yuklab olish» nomi «Dublyaj ovozini yuklab olish (WAV)» ga o'zgardi, u faqat dublyajni beradi; (d) birinchi dublyajdan keyin asl ovoz o'zi 30% ga tushmaydi, o'rniga maslahat chiqadi. Telefonda sinash kerak.
22: Eslatmaga ikki reja qo'shildi (ovozni musiqa/shovqindan tozalash, do'stlar bilan onlayn dublyaj); ilovaning o'zi o'zgarmadi.
67: (Raqam Opus hisobiga moslandi: 66 dan keyin.) «Dublyaj» tugmasi pastki menyuda ko'k porlash bilan ajratildi. Dublyaj studiyasida «Qaysi bo'lak» tugmasi: har dublyaj bo'lagiga alohida ovoz turi tanlanadi (tanlanmasa hammasiga). Ovoz turi bo'lak bilan birga saqlanadi. Telefonda sinash kerak.
14-18 va 23-66: tarixga yozilmagan (boshqa AI tomonidan qilingan; mazmuni noma'lum).
68: Taymlayn masshtab slayderi qo'shildi (ikki barmoq bilan kattalashtirish ilgari bor edi). Eslatmadagi eskirgan raqam va chegaralar to'g'rilandi. Telefonda sinash kerak.
69: Dublyaj oynasida: (a) «Kim: ...» tugmasi: qatorga Erkak/Ayol/Qiz/Yigit/Bola yoki o'z ismini qo'lda belgilash (subs[].spk), «keyingi qatorlarga ham» tanlovi bilan; (b) «✎ Matn»: shu qator matnini oynaning o'zida o'zgartirish/qisqartirish, belgi/soniya va tavsiya etilgan uzunlik ko'rinadi. Eslatmadagi bajarilgan rejalar «BAJARILDI» deb belgilandi. Telefonda sinash kerak.
70: Dublyaj oynasi ochilganda tahrirlash ekranining yuqori paneli («Bosh», Saqlash, «Videoni olish») yashirinadi, shunda video va subtitr oynasi to'liq ko'rinadi; oyna yopilganda panel qaytadi.

5. REJADA
- Musiqa tarjima qilish: hozircha ishlamaydi, faqat tugma bor. Foydalanuvchi keyin o'ylab ko'radi.
- Shorts uchun takliflar (foydalanuvchi tanlasa): tarjimadan keyin avtomatik saqlash, subtitr uslubini oldindan tanlash, natijalar ro'yxati.
- Katta Video tarjima qilish oynasi alohida yangilanadi (foydalanuvchi buni keyin boshlaydi).
- Netlify: ilova to'liq tayyor bo'lgandan keyin Netlify'ga yuklanadi. Hozir qilinmaydi; foydalanuvchi so'ragach yoki eslatma so'ralganda eslatib o'ting.
- «Color Mania» tugmasi: ilovaga qo'shiladi. Nima qilishi hali aniqlanmagan, foydalanuvchi o'zi aytganda so'rab aniqlashtiring. Hozir qo'shilmaydi.
- Katta videolar: telefon xotirasi muammosi. 1-bosqich: BAJARILDI (11-yangilanish), telefonda sinash kutilmoqda. 2-bosqich: MP4 ovozini bo'laklab o'qish. Telefonda sinab ko'rish shart.
- Qo'llanma gapi va saveDub tozalash: BAJARILDI (12-yangilanish).
- Taymlayn zoom: BAJARILDI (ikki barmoq bilan va 68-yangilanishda slayder).
- Loyiha ro'yxatini (sds_w) localStorage dan IndexedDB ga ko'chirish: QISMAN BAJARILDI (store() endi ikkala joyga yozadi); ommaviy saytdan oldin to'liq ko'chirish yaxshi.

- Tarjimani to'xtagan joydan davom ettirish (TAVSIYA: keyingi navbatdagi ish). Internet uzilsa yoki Groq limiti tugasa, tayyor bo'laklar saqlansin, qayta boshlaganda ular o'tkazib yuborilsin. BAJARILDI (20-yangilanish).
- Katta video, 2-bosqich (1 GB gacha): MP4 ovozini bo'laklab o'qib, to'g'ridan-to'g'ri Whisperga yuborish. BAJARILDI (mp4Audio va fastAudio, 3 soatgacha, faqat MP4+AAC). Telefonda sinash natijasi kutilmoqda.
- Groq limiti: bepul tarifda soatiga 2 soat, kuniga 8 soat audio (limit kalitga emas, hisobga tegishli). Qaror kutilmoqda: pullik tarif yoki limit tugaganda OpenAI Whisperga avtomatik o'tish.
- Dublyaj oynasida «Oldingi» tugmasi: BAJARILDI.
- «Dublyaj» tugmasini pastki menyuda markazga, ko'k porlash bilan ajratish BAJARILDI (67-yangilanish).
- Har bir dublyaj bo'lagiga alohida ovoz turi: BAJARILDI (67). «Kim gapiryapti» belgisi: BAJARILDI (69, qo'lda belgilanadi; ovozdan o'zi aniqlash imkonsiz).
- Taymlayn zoom: BAJARILDI (68).
- Loyiha ro'yxatini localStorage (sds_w) dan IndexedDB ga ko'chirish (ommaviy saytdan oldin yaxshi).
- Dublyaj ovoz turlari (Bola, Ayol, Qalin) tezlikni o'zgartiradi, haqiqiy ovoz o'zgartirish emas; uzun dublyajda mixWav() qotishini telefonda sinash.
- Mikrofon: file:// yoki content:// orqali ochilsa ishlamaydi; sayt (HTTPS) orqali ishlaydi. Xato chiqqanda tushunarliroq yo'naltiruvchi xabar qo'yish.
- Tugmalarda bosilganda (:active) effekti hamma joyda borligini tekshirish (hozir 10 joyda bor).
- Eksport real vaqtda yoziladi (24 daqiqalik video uchun 24 daqiqa); boshqa telefonlarda sinash.
- Zaxira: har versiya alohida fayl; kelajakda GitHub (private) ga yuklash mumkin.
- Netlify: vaqtinchalik sinov uchun yuklash mumkin (Qalam_Studio_sayt.zip, ichida index.html); to'liq tayyor bo'lgach doimiy.
- «Color Mania» tugmasi: vazifasi hali aniqlanmagan, foydalanuvchi aytadi.
- Ovozni musiqa va shovqindan tozalash (foydalanuvchi keyinroq qo'shmoqchi; hozir QO'SHILMAYDI). Haqiqiy ajratish (vokal/musiqa) AI model talab qiladi: telefonda, bitta HTML faylda realistik emas, faqat tashqi pullik xizmat orqali mumkin. Yengil yo'l: Whisperga yuborishdan oldin nutq diapazoniga filtr + balandlikni tekislash, va yoqish/o'chirish tugmasi bilan «Musiqali video» rejimi (Whisper filtrlari yumshoqroq). Kafolat yo'q, foydalanuvchi o'z videosida solishtiradi.
- Do'stlar bilan onlayn dublyaj tugmasi (foydalanuvchi keyinroq qo'shmoqchi; hozir QO'SHILMAYDI). Nima qilishi hali aniqlanmagan: foydalanuvchi aytganda so'rab aniqlashtiring (bir vaqtda yozishmi, navbatma-navbat bo'laklarni bo'lib olishmi, havola orqali taklifmi). Muhim: ilovada server yo'q, onlayn ulashish uchun alohida server yoki tayyor xizmat (masalan Firebase) kerak bo'ladi; bu faqat Netlify'ga chiqqandan keyin ma'noli.

6. ESLATISH QOIDASI
Foydalanuvchi «eslatmalarni eslat» desa, 5-bo'limni o'qib, qisqa ro'yxat bering. O'zingiz kerakmas joyda eslatavermang.

<script>
const APP_VER=70;
const $=s=>document.querySelector(s),vid=$('#vid'),dubEl=$('#dubEl'),musEl=$('#musEl');
let AIM=false,TXM=false,DRAW=false,CUTM=false,IMS=null,ITOOL=null,SNX=false,SNY=false,RDEG=null,lastIMS=undefined,IMGM=false,DUBM=false,fx=null,SRC=[],lastSig='',ADRAG=false,lastOnKey='';const imgDom={};try{dubEl.preservesPitch=dubEl.webkitPreservesPitch=dubEl.mozPreservesPitch=false}catch(e){}
let S={id:null,name:'',url:null,subs:[],dub:null,dubs:[],ov:1,dv:1,mus:null,mv:.5,imgs:[],voice:'asl',thumb:''},works=[],rec=false,mr=null,chunks=[],recOff=0,relink=null,thumbDone=false,mode='',busy=false,PV=null,gMoved=false,SELS=null,BASEH=0,thumbKey='';
try{works=JSON.parse(localStorage.getItem('sds_w')||'[]')}catch(e){}
 setTimeout(async()=>{try{const r=await idb.get('worksjson');if(!r)return;const o=JSON.parse(r),lt=+localStorage.getItem('sds_wt')||0;if(o.t>lt||!works.length){const arr=JSON.parse(o.j);if(Array.isArray(arr)&&arr.length){works=arr;if(typeof renderHome=='function')renderHome()}}}catch(e){}},0);
const store=()=>{let j;try{j=JSON.stringify(works.map(w=>({...w,url:null,dubS:null,musS:null})))}catch(e){return}
  const t=Date.now();let okL=true;try{localStorage.setItem('sds_w',j);localStorage.setItem('sds_wt',String(t))}catch(e){okL=false}
  Promise.resolve().then(()=>idb.put('worksjson',JSON.stringify({t,j}))).catch(()=>false).then(okI=>{if(!okL&&!okI&&!window._qw){window._qw=1;alert("Saqlash xotirasi to'lib qoldi. Eski loyihalarni o'chiring, aks holda o'zgarishlar yo'qolishi mumkin.")}})};
const fmt=t=>{t=Math.round((t||0)*10)/10;const m=Math.floor(t/60),s=(t%60).toFixed(1);return m+':'+(+s<10?'0':'')+s};
/* Video va ovozni qurilmada saqlash (IndexedDB) */
const idb={db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('sds',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async put(k,v){try{const d=await this.open();return await new Promise(res=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)})}catch(e){return false}},
  async get(k){try{const d=await this.open();return await new Promise(res=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}},
  async del(k){try{const d=await this.open();return await new Promise(res=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)})}catch(e){return false}}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const pad=(n,l=2)=>String(n).padStart(l,'0');
const srtT=t=>{const ms=Math.round(t*1000);return pad(Math.floor(ms/3600000))+':'+pad(Math.floor(ms/60000)%60)+':'+pad(Math.floor(ms/1000)%60)+','+pad(ms%1000,3)};
const parseT=s=>{s=String(s).trim().replace(',','.');if(s.includes(':')){const p=s.split(':').map(Number);return p.length==3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]}return +s};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const active=t=>S.subs.find(s=>t>=s.start&&t<=s.end);

/* ---------- HOME ---------- */
const fmtD=t=>{t=Math.round(t||0);return Math.floor(t/60)+':'+pad(t%60)};
const card=w=>`<div class="pc" data-id="${w.id}"><div class="th">${w.thumb?`<img src="${w.thumb}">`:''}<span class="pl2">▶</span></div><button class="x" data-del="${w.id}">✕</button><div class="nm">${esc(w.name)}${w.dur?` <small>(${fmtD(w.dur)})</small>`:''}</div></div>`;
function renderHome(){
  const cur=works.filter(w=>w.kind!='export'),done=works.filter(w=>w.kind=='export');
  $('#wCur').innerHTML=cur.map(card).join('')||'<p class="note">Hali loyiha yo\'q.<br>Yuqoridagi tugmalardan birini bosing.</p>';$('#cCur').textContent=cur.length;

function openPlain(f){const url=URL.createObjectURL(f),w={id:Date.now(),name:f.name.replace(/\.[^.]+$/,''),date:new Date().toLocaleDateString('uz'),subs:0,thumb:'',kind:'project',data:[],url};works.unshift(w);store();idb.put('v'+w.id,f);relink=null;openEditor(w,url)}
function transSheet(ok){
  const big=SH_KIND=='big',n=ok.length;PEND=ok;
  const lo=LANGS.map(l=>`<option value="${l[0]}">${l[1]} tili</option>`).join('');
  sheet(`<h3>${big?'Video tarjima qilish':'Shorts tarjima qilish'}</h3>
  <p class="note" style="margin-top:0">${n==1?'Tanlandi: '+esc(ok[0].name):n+' ta video tanlandi'}. Endi tillarni tanlang.</p>
  <label>Videodagi til</label><select id="h_s"><option value="auto">Avto-aniqlash</option>${lo}</select>
  <label>Tarjima tili</label><select id="h_t">${lo}</select>
  <label>Uslub</label><select id="h_y"><option value="og'zaki">Og'zaki</option><option value="oddiy, sodda va tushunarli">Oddiy</option><option value="rasmiy">Rasmiy</option><option value="anime uslubida">Anime uslubida</option></select>
  <button class="pb" id="h_go">Tarjimani boshlash</button>
  ${big?'<button class="pb g" id="h_ed">Tarjimasiz, faqat tahrirlash uchun ochish</button>':''}
  <p class="note">Tarjimadan keyin subtitrni tahrirlash, dublyaj qo'shish va videoni kesish mumkin. Kalitlar kiritilmagan bo'lsa, avval bosh sahifadagi sozlamalarga kiring.</p>`);
  $('#h_s').value=K.get('ls')||'auto';$('#h_t').value=K.get('lt')||'uz';
  const y=K.get('ly');if(y&&[...$('#h_y').options].some(o=>o.value==y))$('#h_y').value=y;
  $('#h_go').onclick=()=>{
    const opt={s:$('#h_s').value,t:$('#h_t').value,y:$('#h_y').value};
    if(opt.s!='auto'&&opt.s==opt.t)return alert('Nutq tili va tarjima tili bir xil. Boshqa til tanlang.');
    if(PEND.some(f=>f.size>SH_MB*1048576))return alert('Video hajmi ko\'pi bilan '+SH_MB+' MB bo\'lsin. Kattaroq videoni faqat tahrirlash uchun ochish mumkin.');
    closeSheet();startBatch(PEND,opt)};
  const ed=$('#h_ed');if(ed)ed.onclick=()=>{closeSheet();openPlain(PEND[0])};
}
$('#bigBtn').onclick=()=>pickVideo('big');
$('#shortBtn').onclick=()=>pickVideo('short');
$('#musBtn').onclick=()=>{if(busy)return;sheet('<h3>Musiqa tarjima qilish</h3><p class="note" style="margin-top:0">Bu bo\'lim hali tayyor emas. Keyingi yangilanishlarda qo\'shiladi.</p><button class="pb" id="m_ok">Tushunarli</button>');$('#m_ok').onclick=()=>$('#shx').click()};
{const v=$('#ver');if(v)v.textContent='Qalam Studio · '+APP_VER+'-yangilanish'}
$('#fsh').onchange=async e=>{
  const fl=[...e.target.files];e.target.value='';if(!fl.length||busy)return;
  const ok=[],skip=[];
  if(SH_KIND=='big')ok.push(fl[0]);
  else for(const f of fl){
    if(f.size>SH_MB*1048576){skip.push(f.name+' (hajmi katta)');continue}
    const d=await vidDur(f);
    if(d>SH_SEC+1){skip.push(f.name+' (uzun)');continue}
    ok.push(f)}
  if(skip.length)alert("Bu videolar o'tkazib yuborildi:\n"+skip.join('\n')+"\n\nShorts uchun har biri ko'pi bilan "+SH_SEC/60+" daqiqa va "+SH_MB+" MB bo'lsin. Uzunroq videolar uchun «Video tarjima qilish» tugmasidan foydalaning.");
  if(!ok.length)return;
  if(SH_KIND=='big'){openPlain(ok[0]);return}
  transSheet(ok);
};
async function startBatch(ok,opt){
  if(busy)return;let done=0,fail=false;
  for(let i=0;i<ok.length;i++){
    const f=ok[i],url=URL.createObjectURL(f);
    const w={id:Date.now()+i,name:f.name.replace(/\.[^.]+$/,''),date:new Date().toLocaleDateString('uz'),subs:0,thumb:'',kind:'project',data:[],url};
    works.unshift(w);store();idb.put('v'+w.id,f);relink=null;
    openEditor(w,url);
    await new Promise(r=>{vid.addEventListener('loadedmetadata',()=>r(),{once:true});setTimeout(r,10000)});
    aiSheet();$('#a_s').value=opt.s;$('#a_t').value=opt.t;$('#a_y').value=opt.y;
    const pr=runAI();const h3=$('#sh h3');if(h3&&ok.length>1)h3.textContent='AI Tarjima ('+(i+1)+'/'+ok.length+')';
    await pr;
    if(!S.subs.some(x=>x.ai)){fail=true;break}
    persist();store();done++;
  }
  if(fail)return;
  if(ok.length==1){const a=$('#a_act');if(a){a.insertAdjacentHTML('beforeend','<button class="pb g" id="n_d">Dublyaj qo\'shish</button><button class="pb g" id="n_k">Videoni kesish</button><button class="pb g" id="n_e">↑ Videoni olish</button>');
    $('#n_d').onclick=()=>{closeSheet();$('#bD').click()};$('#n_k').onclick=()=>{closeSheet();$('#bK').click()};$('#n_e').onclick=()=>{closeSheet();$('#exB').click()}}}
  else{closeSheet();$('#back').click();sheet('<h3>Tayyor</h3><p class="note" style="margin-top:0">'+done+' ta video tarjima qilindi. Ularni «Ishlayotgan loyihalar» bo\'limidan ochib, dublyaj qo\'shish, kesish va saqlash mumkin.</p><button class="pb" id="h_ok">Yaxshi</button>');$('#h_ok').onclick=()=>$('#shx').click()}
}

try{if(!localStorage.getItem('qs_seen')){localStorage.setItem('qs_seen','1');setTimeout(helpSheet,500)}}catch(e){}
</script></body></html>
